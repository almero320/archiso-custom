
name: Build ArchForge Offline ISO

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'profile/**'
      - 'packages/**'
      - 'installer/**'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: archforge-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project
        shell: bash
        run: |
          set -Eeuo pipefail

          bash -n scripts/build.sh
          bash -n installer/archforge-install

          test -s packages/target.txt
          test -s profile/packages.x86_64
          test -s installer/archforge-live-pacman.conf
          test -s installer/archforge-target-pacman.conf
          test -s README.md

      - name: Build in privileged Arch container
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$GITHUB_WORKSPACE/out"

          docker pull archlinux:latest

          docker run --privileged --rm \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace" \
            --workdir /workspace \
            archlinux:latest \
            bash -Eeuo pipefail -c '
              pacman -Syu --noconfirm

              pacman -S --needed --noconfirm \
                archiso \
                git \
                squashfs-tools \
                dosfstools \
                mtools \
                grub \
                libisoburn \
                rsync \
                pacman-contrib

              chmod 0755 installer/archforge-install

              bash -n scripts/build.sh
              bash -n installer/archforge-install

              bash scripts/build.sh
            '

      - name: Verify ISO and checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob

          ISOS=(out/*_VTGRUB2.iso)

          if (( ${#ISOS[@]} != 1 )); then
            echo "ERROR: Expected exactly one VTGRUB2 ISO."
            printf 'Found: %s\n' "${ISOS[@]:-none}"
            exit 1
          fi

          ISO="${ISOS[0]}"

          test -s "$ISO"
          test -s "$ISO.sha256"

          (
            cd out
            sha256sum "$(basename "$ISO")" > SHA256SUMS
          )

          echo "ISO details:"
          ls -lh "$ISO" "$ISO.sha256" out/SHA256SUMS
          file "$ISO"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: archforge-offline-${{ github.run_number }}
          path: |
            out/*_VTGRUB2.iso
            out/*.iso.sha256
            out/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
